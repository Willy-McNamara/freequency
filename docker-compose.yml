services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-default_password}
      - DATABASE_URL_V3=${DATABASE_URL_V3}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_BUCKET_REGION=${AWS_BUCKET_REGION}
      - AWS_S3_DEV_ACCESS_KEY=${AWS_S3_DEV_ACCESS_KEY}
      - AWS_S3_DEV_SECRET_ACCESS_KEY=${AWS_S3_DEV_SECRET_ACCESS_KEY}
      - BACKEND_URL=${BACKEND_URL}
      - DEBUG=${DEBUG}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
      - NODE_ENV=production
      - MAX_OLD_SPACE_SIZE=512
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 60s
      timeout: 15s
      retries: 4
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "0.8"
        reservations:
          memory: 200M
          cpus: "0.3"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-default_password} --bind 0.0.0.0
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-default_password}",
          "ping",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge
