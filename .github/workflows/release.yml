name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Update package versions
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}

          # Update root package.json
          npm version $VERSION --no-git-tag-version

          # Update frontend package.json
          cd frontend
          npm version $VERSION --no-git-tag-version

          # Update API package.json
          cd ../api
          npm version $VERSION --no-git-tag-version

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}

          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            # Generate changelog from commits
            echo "## What's New in $VERSION" > release_notes.md
            echo "" >> release_notes.md

            # Get commits since last tag
            git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD >> release_notes.md

            echo "" >> release_notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$VERSION" >> release_notes.md
          else
            echo "## Initial Release $VERSION" > release_notes.md
            echo "" >> release_notes.md
            echo "First release of Freequency!" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Update release notes in app
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}

          # Create release data for the app
          cat > frontend/src/data/releases.json << EOF
          {
            "latestVersion": "$VERSION",
            "releases": [
              {
                "version": "$VERSION",
                "date": "$(date -u +%Y-%m-%d)",
                "notes": $(cat release_notes.md | jq -Rs .)
              }
            ]
          }
          EOF

      - name: Commit version updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}" || exit 0
          git push origin main || exit 0

