name: Deploy to EC2

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      VITE_API_BASE_URL: ${{ secrets.BACKEND_URL }}
      DATABASE_URL_V3: ${{ secrets.DATABASE_URL_V3 }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      AWS_BUCKET_REGION: ${{ secrets.AWS_BUCKET_REGION }}
      AWS_S3_DEV_ACCESS_KEY: ${{ secrets.AWS_S3_DEV_ACCESS_KEY }}
      AWS_S3_DEV_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_DEV_SECRET_ACCESS_KEY }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      DEBUG: ${{ secrets.DEBUG }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run backend tests
        run: |
          cd api
          npm ci
          npm run test -- --ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm run test

      - name: Show latest commit
        run: git log -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build --no-cache --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL -t freequency-dev .

      - name: Tag Docker image
        run: |
          docker tag freequency-dev:latest $ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REPOSITORY:latest

      - name: Deploy via AWS Systems Manager
        run: |
          # Create a JSON file for the commands to avoid parsing issues
          cat > deploy-commands.json << 'EOF'
          {
            "commands": [
              "set -e",
              "echo \"🚀 Starting deployment...\"",
              "echo \"🔍 DEBUG: Current working directory: $(pwd)\"",
              "echo \"🔍 DEBUG: Current user: $(whoami)\"",
              "echo \"🔍 DEBUG: Available disk space: $(df -h . | head -2)\"",
              "echo \"🔍 DEBUG: Docker version: $(sudo docker --version)\"",
              "echo \"🔍 DEBUG: Docker Compose version: $(sudo docker-compose --version 2>/dev/null || echo 'Not installed')\"",
              "export AWS_REGION=${{ secrets.AWS_REGION }}",
              "export ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}",
              "export DATABASE_URL_V3=\"${{ secrets.DATABASE_URL_V3 }}\"",
              "export GOOGLE_CLIENT_ID=\"${{ secrets.GOOGLE_CLIENT_ID }}\"",
              "export GOOGLE_CLIENT_SECRET=\"${{ secrets.GOOGLE_CLIENT_SECRET }}\"",
              "export JWT_SECRET=\"${{ secrets.JWT_SECRET }}\"",
              "export AWS_S3_BUCKET_NAME=\"${{ secrets.AWS_S3_BUCKET_NAME }}\"",
              "export AWS_BUCKET_REGION=\"${{ secrets.AWS_BUCKET_REGION }}\"",
              "export AWS_S3_DEV_ACCESS_KEY=\"${{ secrets.AWS_S3_DEV_ACCESS_KEY }}\"",
              "export AWS_S3_DEV_SECRET_ACCESS_KEY=\"${{ secrets.AWS_S3_DEV_SECRET_ACCESS_KEY }}\"",
              "export BACKEND_URL=\"${{ secrets.BACKEND_URL }}\"",
              "export DEBUG=\"${{ secrets.DEBUG }}\"",
              "export SENTRY_AUTH_TOKEN=\"${{ secrets.SENTRY_AUTH_TOKEN }}\"",
              "export REDIS_PASSWORD=\"${{ secrets.REDIS_PASSWORD }}\"",
              "echo \"🔍 DEBUG: Environment variables set successfully\"",
              "echo \"🔍 DEBUG: ECR_REPOSITORY=$ECR_REPOSITORY\"",
              "echo \"🔍 DEBUG: BACKEND_URL=$BACKEND_URL\"",
              "echo \"🔍 DEBUG: REDIS_PASSWORD length: ${#REDIS_PASSWORD}\"",
              "echo \"🔐 Authenticating with ECR...\"",
              "aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REPOSITORY",
              "echo \"📤 Pre-deployment: Uploading current logs to S3...\"",
              "if sudo docker ps | grep -q freequency-app; then",
              "  echo \"  Container is running, uploading logs before stopping...\"",
              "  sudo docker exec freequency-app /bin/sh -lc \"/bin/sh /app/api/scripts/upload-logs-to-s3.sh\" || {",
              "    echo \"  Warning: Log upload failed, but continuing with deployment...\"",
              "  }",
              "else",
              "  echo \"  No running container found, skipping log upload...\"",
              "fi",
              "echo \"🛑 Stopping and removing existing containers...\"",
              "echo \"  Cleaning up Docker Compose services...\"",
              "sudo docker-compose down || true",
              "echo \"  Cleaning up legacy single containers...\"",
              "sudo docker stop freequency-app || true",
              "sudo docker rm freequency-app || true",
              "sudo docker stop freequency-redis || true",
              "sudo docker rm freequency-redis || true",
              "echo \"🧹 Aggressive cleanup of old images and containers...\"",
              "sudo docker container prune -f || true",
              "sudo docker image prune -a -f || true",
              "sudo docker image prune -f || true",
              "sudo docker builder prune -f || true",
              "echo \"📊 Checking available disk space...\"",
              "df -h /",
              "echo \"📊 Checking Docker disk usage...\"",
              "sudo docker system df",
              "echo \"🔍 Verifying sufficient disk space for new image...\"",
              "FREE_SPACE=$(df / | awk \"NR==2 {print \\$4}\")",
              "FREE_SPACE_MB=$((FREE_SPACE / 1024))",
              "if [ $FREE_SPACE_MB -lt 2048 ]; then",
              "  echo \"❌ Insufficient disk space! Only ${FREE_SPACE_MB}MB available, need at least 2GB\"",
              "  echo \"🧹 Attempting emergency cleanup...\"",
              "  sudo docker system prune -a -f --volumes || true",
              "  sudo apt-get clean || true",
              "  sudo apt-get autoremove -y || true",
              "  FREE_SPACE=$(df / | awk \"NR==2 {print \\$4}\")",
              "  FREE_SPACE_MB=$((FREE_SPACE / 1024))",
              "  echo \"📊 Available space after emergency cleanup: ${FREE_SPACE_MB}MB\"",
              "  if [ $FREE_SPACE_MB -lt 1024 ]; then",
              "    echo \"❌ Still insufficient space after cleanup. Manual intervention required.\"",
              "    exit 1",
              "  fi",
              "else",
              "  echo \"✅ Sufficient disk space available: ${FREE_SPACE_MB}MB\"",
              "fi",
              "echo \"📥 Pulling latest image...\"",
              "sudo docker pull $ECR_REPOSITORY:latest || {",
              "  echo \"❌ Failed to pull Docker image\"",
              "  exit 1",
              "}",
              "echo \"🔴 Setting up Redis and starting services...\"",
              "DEPLOY_PATH=\"/home/ubuntu/freequency\"",
              "echo \"🔍 DEBUG: Target deployment path: $DEPLOY_PATH\"",
              "echo \"🔍 DEBUG: Current working directory before cd: $(pwd)\"",
              "if [ ! -d \"$DEPLOY_PATH\" ]; then",
              "  echo \"📁 Creating deployment directory $DEPLOY_PATH...\"",
              "  sudo mkdir -p $DEPLOY_PATH",
              "  sudo chown ubuntu:ubuntu $DEPLOY_PATH",
              "fi",
              "echo \"🔍 DEBUG: About to change to directory: $DEPLOY_PATH\"",
              "cd $DEPLOY_PATH || {",
              "  echo \"❌ Failed to change to deployment directory $DEPLOY_PATH\"",
              "  echo \"🔍 DEBUG: Current directory: $(pwd)\"",
              "  echo \"🔍 DEBUG: Directory contents: $(ls -la)\"",
              "  exit 1",
              "}",
              "echo \"🔍 DEBUG: Successfully changed to directory: $(pwd)\"",
              "echo \"📋 Setting up docker-compose.yml for production...\"",
              "echo \"🔍 DEBUG: ECR_REPOSITORY value: '$ECR_REPOSITORY'\"",
              "echo \"🔍 DEBUG: About to create docker-compose.yml with image: $ECR_REPOSITORY:latest\"",
              "echo \"🔍 DEBUG: Creating docker-compose.yml with direct value substitution...\"",
              "cat > docker-compose.yml << COMPOSE_EOF",
              "services:",
              "  app:",
              "    image: $ECR_REPOSITORY:latest",
              "    ports:",
              "      - '3000:3000'",
              "    environment:",
              "      - REDIS_HOST=redis",
              "      - REDIS_PORT=6379",
              "      - REDIS_PASSWORD=$REDIS_PASSWORD",
              "      - DATABASE_URL_V3=$DATABASE_URL_V3",
              "      - GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID",
              "      - GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET",
              "      - JWT_SECRET=$JWT_SECRET",
              "      - AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME",
              "      - AWS_BUCKET_REGION=$AWS_BUCKET_REGION",
              "      - AWS_S3_DEV_ACCESS_KEY=$AWS_S3_DEV_ACCESS_KEY",
              "      - AWS_S3_DEV_SECRET_ACCESS_KEY=$AWS_S3_DEV_SECRET_ACCESS_KEY",
              "      - BACKEND_URL=$BACKEND_URL",
              "      - DEBUG=$DEBUG",
              "      - SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN",
              "    volumes:",
              "      - ./logs:/app/logs",
              "    depends_on:",
              "      - redis",
              "    networks:",
              "      - app-network",
              "    restart: unless-stopped",
              "  redis:",
              "    image: redis:7-alpine",
              "    command: redis-server --requirepass $REDIS_PASSWORD --bind 0.0.0.0",
              "    ports:",
              "      - '6379:6379'",
              "    volumes:",
              "      - redis-data:/data",
              "    networks:",
              "      - app-network",
              "    restart: unless-stopped",
              "volumes:",
              "  redis-data:",
              "networks:",
              "  app-network:",
              "    driver: bridge",
              "COMPOSE_EOF",
              "echo \"🔍 DEBUG: docker-compose.yml created, verifying contents...\"",
              "echo \"🔍 DEBUG: Checking if variables were expanded correctly...\"",
              "if grep -q '\\$ECR_REPOSITORY' docker-compose.yml; then",
              "  echo \"❌ ERROR: ECR_REPOSITORY variable not expanded!\"",
              "  echo \"🔍 DEBUG: docker-compose.yml contents:\"",
              "  cat docker-compose.yml",
              "  exit 1",
              "fi",
              "if grep -q '\\$REDIS_PASSWORD' docker-compose.yml; then",
              "  echo \"❌ ERROR: REDIS_PASSWORD variable not expanded!\"",
              "  echo \"🔍 DEBUG: docker-compose.yml contents:\"",
              "  cat docker-compose.yml",
              "  exit 1",
              "fi",
              "echo \"✅ Environment variables expanded successfully\"",
              "echo \"✅ docker-compose.yml created for production\"",
              "echo \"🚀 Starting services with Docker Compose...\"",
              "echo \"🔍 DEBUG: Checking if docker-compose is available...\"",
              "if ! sudo command -v docker-compose > /dev/null 2>&1; then",
              "  echo \"🔍 DEBUG: docker-compose not found, installing...\"",
              "  echo \"  Attempting primary installation method...\"",
              "  echo \"🔍 DEBUG: Downloading from: https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)\"",
              "  echo \"🔍 DEBUG: Target location: /usr/local/bin/docker-compose\"",
              "  if sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)\" -o /usr/local/bin/docker-compose --silent --show-error --fail; then",
              "    echo \"🔍 DEBUG: Primary download successful, setting permissions...\"",
              "    sudo chmod +x /usr/local/bin/docker-compose",
              "    echo \"🔍 DEBUG: Verifying installation...\"",
              "    sudo docker-compose --version",
              "    echo \"✅ Docker Compose installed successfully via primary method\"",
              "  else",
              "    echo \"🔍 DEBUG: Primary method failed with exit code $?\"",
              "    echo \"  Primary method failed, trying fallback...\"",
              "    echo \"🔍 DEBUG: Downloading fallback from: https://github.com/docker/compose/releases/download/v2.20.3/docker-compose-$(uname -s)-$(uname -m)\"",
              "    if sudo curl -L \"https://github.com/docker/compose/releases/download/v2.20.3/docker-compose-$(uname -s)-$(uname -m)\" -o /usr/local/bin/docker-compose --silent --show-error --fail; then",
              "      echo \"🔍 DEBUG: Fallback download successful, setting permissions...\"",
              "      sudo chmod +x /usr/local/bin/docker-compose",
              "      echo \"🔍 DEBUG: Verifying fallback installation...\"",
              "      sudo docker-compose --version",
              "      echo \"✅ Docker Compose installed successfully via fallback method\"",
              "    else",
              "      echo \"🔍 DEBUG: Fallback method failed with exit code $?\"",
              "      echo \"❌ All Docker Compose installation methods failed\"",
              "      echo \"🔍 DEBUG: Checking what's in /usr/local/bin/\"",
              "      ls -la /usr/local/bin/ | grep docker || echo \"No docker files found\"",
              "      exit 1",
              "    fi",
              "  fi",
              "else",
              "  echo \"🔍 DEBUG: docker-compose already available: $(sudo command -v docker-compose)\"",
              "  sudo docker-compose --version",
              "fi",
              "echo \"🔍 DEBUG: About to start Docker Compose services...\"",
              "echo \"🔍 DEBUG: Current directory contents:\"",
              "ls -la",
              "echo \"🔍 DEBUG: docker-compose.yml contents:\"",
              "cat docker-compose.yml",
              "echo \"🔍 DEBUG: Environment file contents:\"",
              "cat .env 2>/dev/null || echo \"No .env file found\"",
              "echo \"🔍 DEBUG: Starting services with docker-compose up -d...\"",
              "sudo docker-compose up -d || {",
              "  echo \"❌ Docker Compose failed to start services\"",
              "  echo \"🔍 DEBUG: docker-compose up failed with exit code $?\"",
              "  echo \"🔍 DEBUG: Checking docker-compose logs:\"",
              "  sudo docker-compose logs || echo \"No logs available\"",
              "  echo \"🔍 DEBUG: Checking Docker container status:\"",
              "  sudo docker ps -a",
              "  echo \"🔍 DEBUG: Checking Docker network status:\"",
              "  sudo docker network ls",
              "  echo \"🔍 DEBUG: Checking Docker volume status:\"",
              "  sudo docker volume ls",
              "  exit 1",
              "}",
              "echo \"⏳ Waiting for services to be ready...\"",
              "sleep 15",
              "echo \"🔴 Checking Redis health...\"",
              "sudo docker-compose exec -T redis redis-cli -a \"$REDIS_PASSWORD\" ping || {",
              "  echo \"❌ Redis health check failed\"",
              "  sudo docker-compose logs redis",
              "  exit 1",
              "}",
              "echo \"✅ Redis is healthy\"",
              "echo \"🔍 Checking app health (with retries)...\"",
              "max_attempts=6",
              "attempt=1",
              "while [ $attempt -le $max_attempts ]; do",
              "  echo \"  Attempt $attempt/$max_attempts...\"",
              "  if curl -f $BACKEND_URL/health > /dev/null 2>&1; then",
              "    echo \"✅ Health check passed!\"",
              "    break",
              "  fi",
              "  if [ $attempt -eq $max_attempts ]; then",
              "    echo \"❌ Health check failed after $max_attempts attempts!\"",
              "    echo \"📋 Container logs:\"",
              "    sudo docker-compose logs",
              "    exit 1",
              "  fi",
              "  echo \"  Health check failed, waiting 10 seconds before retry...\"",
              "  sleep 10",
              "  attempt=$((attempt + 1))",
              "done",
              "echo \"✅ Deployment successful! Services are running and healthy.\""
            ]
          }
          EOF

          # Send deployment command via SSM
          echo "🚀 Sending deployment command to EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters file://deploy-commands.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "📋 Command ID: $COMMAND_ID"

          # Wait for command to complete and monitor status
          echo "⏳ Waiting for deployment to complete..."
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'Status' \
              --output text)

            echo "📊 Current status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }}
              exit 1
            fi

            echo "⏳ Still running... waiting 10 seconds before next check"
            sleep 10
          done

          # Show final output
          echo "📋 Final deployment output:"
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
