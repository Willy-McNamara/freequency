name: Deploy to EC2

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      VITE_API_BASE_URL: ${{ secrets.BACKEND_URL }}
      DATABASE_URL_V3: ${{ secrets.DATABASE_URL_V3 }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      AWS_BUCKET_REGION: ${{ secrets.AWS_BUCKET_REGION }}
      AWS_S3_DEV_ACCESS_KEY: ${{ secrets.AWS_S3_DEV_ACCESS_KEY }}
      AWS_S3_DEV_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_DEV_SECRET_ACCESS_KEY }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      DEBUG: ${{ secrets.DEBUG }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run backend tests
        run: |
          cd api
          npm ci
          npm run test -- --ci

      - name: Run frontend tests
        run: |
          cd frontend
          npm ci
          npm run test

      - name: Show latest commit
        run: git log -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build --no-cache --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL -t freequency-dev .

      - name: Tag Docker image
        run: |
          docker tag freequency-dev:latest $ECR_REPOSITORY:latest

      - name: Push Docker image to ECR
        run: |
          docker push $ECR_REPOSITORY:latest

      - name: Deploy via AWS Systems Manager
        run: |
          # Create a JSON file for the commands to avoid parsing issues
          cat > deploy-commands.json << 'EOF'
          {
            "commands": [
              "set -e",
              "echo \"🚀 Starting deployment...\"",
              "export AWS_REGION=${{ secrets.AWS_REGION }}",
              "export ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}",
              "export DATABASE_URL_V3=\"${{ secrets.DATABASE_URL_V3 }}\"",
              "export GOOGLE_CLIENT_ID=\"${{ secrets.GOOGLE_CLIENT_ID }}\"",
              "export GOOGLE_CLIENT_SECRET=\"${{ secrets.GOOGLE_CLIENT_SECRET }}\"",
              "export JWT_SECRET=\"${{ secrets.JWT_SECRET }}\"",
              "export AWS_S3_BUCKET_NAME=\"${{ secrets.AWS_S3_BUCKET_NAME }}\"",
              "export AWS_BUCKET_REGION=\"${{ secrets.AWS_BUCKET_REGION }}\"",
              "export AWS_S3_DEV_ACCESS_KEY=\"${{ secrets.AWS_S3_DEV_ACCESS_KEY }}\"",
              "export AWS_S3_DEV_SECRET_ACCESS_KEY=\"${{ secrets.AWS_S3_DEV_SECRET_ACCESS_KEY }}\"",
              "export BACKEND_URL=\"${{ secrets.BACKEND_URL }}\"",
              "export DEBUG=\"${{ secrets.DEBUG }}\"",
              "export SENTRY_AUTH_TOKEN=\"${{ secrets.SENTRY_AUTH_TOKEN }}\"",
              "export REDIS_PASSWORD=\"${{ secrets.REDIS_PASSWORD }}\"",
              "echo \"🔐 Authenticating with ECR...\"",
              "aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REPOSITORY",
              "echo \"📤 Pre-deployment: Uploading current logs to S3...\"",
              "if sudo docker ps | grep -q freequency-app; then",
              "  echo \"  Container is running, uploading logs before stopping...\"",
              "  sudo docker exec freequency-app /bin/sh -lc \"/bin/sh /app/api/scripts/upload-logs-to-s3.sh\" || {",
              "    echo \"  Warning: Log upload failed, but continuing with deployment...\"",
              "  }",
              "else",
              "  echo \"  No running container found, skipping log upload...\"",
              "fi",
              "echo \"🛑 Stopping and removing existing containers...\"",
              "sudo docker-compose down || true",
              "sudo docker stop freequency-app || true",
              "sudo docker rm freequency-app || true",
              "echo \"🧹 Aggressive cleanup of old images and containers...\"",
              "sudo docker container prune -f || true",
              "sudo docker image prune -a -f || true",
              "sudo docker image prune -f || true",
              "sudo docker builder prune -f || true",
              "echo \"📊 Checking available disk space...\"",
              "df -h /",
              "echo \"📊 Checking Docker disk usage...\"",
              "sudo docker system df",
              "echo \"🔍 Verifying sufficient disk space for new image...\"",
              "FREE_SPACE=$(df / | awk \"NR==2 {print \\$4}\")",
              "FREE_SPACE_MB=$((FREE_SPACE / 1024))",
              "if [ $FREE_SPACE_MB -lt 2048 ]; then",
              "  echo \"❌ Insufficient disk space! Only ${FREE_SPACE_MB}MB available, need at least 2GB\"",
              "  echo \"🧹 Attempting emergency cleanup...\"",
              "  sudo docker system prune -a -f --volumes || true",
              "  sudo apt-get clean || true",
              "  sudo apt-get autoremove -y || true",
              "  FREE_SPACE=$(df / | awk \"NR==2 {print \\$4}\")",
              "  FREE_SPACE_MB=$((FREE_SPACE / 1024))",
              "  echo \"📊 Available space after emergency cleanup: ${FREE_SPACE_MB}MB\"",
              "  if [ $FREE_SPACE_MB -lt 1024 ]; then",
              "    echo \"❌ Still insufficient space after cleanup. Manual intervention required.\"\"",
              "    exit 1",
              "  fi",
              "else",
              "  echo \"✅ Sufficient disk space available: ${FREE_SPACE_MB}MB\"",
              "fi",
              "echo \"📥 Pulling latest image...\"",
              "sudo docker pull $ECR_REPOSITORY:latest",
              "echo \"🔴 Setting up Redis and starting services...\"",
              "cd /home/ubuntu/freequency",
              "echo \"REDIS_PASSWORD=$REDIS_PASSWORD\" > .env",
              "echo \"DATABASE_URL_V3=$DATABASE_URL_V3\" >> .env",
              "echo \"GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID\" >> .env",
              "echo \"GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET\" >> .env",
              "echo \"JWT_SECRET=$JWT_SECRET\" >> .env",
              "echo \"AWS_S3_BUCKET_NAME=$AWS_S3_BUCKET_NAME\" >> .env",
              "echo \"AWS_BUCKET_REGION=$AWS_BUCKET_REGION\" >> .env",
              "echo \"AWS_S3_DEV_ACCESS_KEY=$AWS_S3_DEV_ACCESS_KEY\" >> .env",
              "echo \"AWS_S3_DEV_SECRET_ACCESS_KEY=$AWS_S3_DEV_SECRET_ACCESS_KEY\" >> .env",
              "echo \"BACKEND_URL=$BACKEND_URL\" >> .env",
              "echo \"DEBUG=$DEBUG\" >> .env",
              "echo \"SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN\" >> .env",
              "echo \"🚀 Starting services with Docker Compose...\"",
              "sudo docker-compose up -d",
              "echo \"⏳ Waiting for services to be ready...\"",
              "sleep 15",
              "echo \"🔴 Checking Redis health...\"",
              "sudo docker-compose exec -T redis redis-cli -a \"$REDIS_PASSWORD\" ping",
              "echo \"🔍 Checking app health (with retries)...\"",
              "max_attempts=6",
              "attempt=1",
              "while [ $attempt -le $max_attempts ]; do",
              "  echo \"  Attempt $attempt/$max_attempts...\"",
              "  if curl -f https://demo.freequencyapp.com/health > /dev/null 2>&1; then",
              "    echo \"✅ Health check passed!\"",
              "    break",
              "  fi",
              "  if [ $attempt -eq $max_attempts ]; then",
              "    echo \"❌ Health check failed after $max_attempts attempts!\"",
              "    echo \"📋 Container logs:\"",
              "    sudo docker-compose logs",
              "    exit 1",
              "  fi",
              "  echo \"  Health check failed, waiting 10 seconds before retry...\"",
              "  sleep 10",
              "  attempt=$((attempt + 1))",
              "done",
              "echo \"✅ Deployment successful! Services are running and healthy.\""
            ]
          }
          EOF

          # Send deployment command via SSM
          echo "🚀 Sending deployment command to EC2..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters file://deploy-commands.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)

          echo "📋 Command ID: $COMMAND_ID"

          # Wait for command to complete and monitor status
          echo "⏳ Waiting for deployment to complete..."
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id ${{ secrets.EC2_INSTANCE_ID }} \
              --query 'Status' \
              --output text)

            echo "📊 Current status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deployment failed with status: $STATUS"
              echo "📋 Command output:"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id ${{ secrets.EC2_INSTANCE_ID }}
              exit 1
            fi

            echo "⏳ Still running... waiting 10 seconds before next check"
            sleep 10
          done

          # Show final output
          echo "📋 Final deployment output:"
          aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id ${{ secrets.EC2_INSTANCE_ID }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
